name: maestro
description: "App de gestão de pedidos Maestro (fiel ao app Android Kotlin)."
publish_to: 'none'
version: 2.0.29+2029

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  lottie: ^3.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP / API
  http: ^1.2.0

  # Estado / tema
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # Versão dinâmica (rodapé do login)
  package_info_plus: ^9.0.0

  # Ícones vetoriais convertidos de VectorDrawable
  flutter_svg: ^2.0.9

  # Imagens de rede

  # Abrir links / URL launcher
  url_launcher: ^6.2.4

  # Arquivos locais
  path_provider: ^2.1.0

  # Permissões
  permission_handler: ^11.3.1

  # WebView (fluxo Microsoft OAuth)
  webview_flutter: ^4.4.2

  # Polling em background + notificações (equiv. PedidoPollingWorker do Kotlin)
  workmanager: ^0.10.9
  flutter_local_notifications: ^17.2.3

  # Áudio (som de novo pedido)
  audioplayers: ^5.2.1

  # Formatação pt-BR
  intl: ^0.20.2

  # Geração de Excel (.xlsx)

  # Geração de PDF
  printing: ^5.11.1

  # Câmera / galeria (telas de fotos)
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/lottie/
    - assets/icons/
    - assets/vectors/

