name: Build Flutter APK (arm64-v8a)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Patch Flutter Gradle plugin onVariants ABI bug
        run: |
          FILE="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterPluginUtils.kt"
          if [ -f "$FILE" ] && grep -q "androidComponents.onVariants {" "$FILE"; then
            sed -i 's/androidComponents.onVariants {/androidComponents.onVariants(androidComponents.selector().all()) {/' "$FILE"
          fi

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > release-key.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Definir versão (tag vX.Y.Z ou run_number)
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$REF_NAME" == v* ]]; then
            echo "name=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build release APK (split arm64-v8a)
        run: flutter build apk --split-per-abi --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --build-number=${{ steps.version.outputs.code }} --build-name="${{ steps.version.outputs.name }}"

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/*arm64-v8a*.apk build/app/outputs/flutter-apk/maestro-release.apk && ls -la build/app/outputs/flutter-apk/maestro-release.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: maestro-release-apk
          path: ${{ github.workspace }}/build/app/outputs/flutter-apk/maestro-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Maestro ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/maestro-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}