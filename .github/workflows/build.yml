name: Build Flutter APK (arm64-v8a)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Patch Flutter Gradle plugin onVariants ABI bug
        run: |
          FILE="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterPluginUtils.kt"
          if [ -f "$FILE" ] && grep -q "androidComponents.onVariants {" "$FILE"; then
            sed -i 's/androidComponents.onVariants {/androidComponents.onVariants(androidComponents.selector().all()) {/' "$FILE"
          fi

      - name: Decode release keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release-key.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK (split arm64-v8a, updatable)
        run: flutter build apk --split-per-abi --target-platform android-arm64 --build-number=$BUILD_NUMBER --build-name="1.0.$BUILD_NUMBER"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: maestro-flutter-arm64-v8a
          path: ${{ github.workspace }}/flutter/build/app/outputs/flutter-apk/*arm64-v8a*.apk
